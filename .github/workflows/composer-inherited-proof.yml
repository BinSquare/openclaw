name: Composer projection and pointer handler diagnostics
on:
  push:
    branches: [solid2/w-chat-5-evidence]
permissions:
  contents: read
concurrency:
  group: composer-projection-handler-diagnostics
  cancel-in-progress: false
jobs:
  diagnostic:
    name: ${{ matrix.label }} diagnostic
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: home
            patch: diagnostic-home.patch
            sha256: b88605ff9e036491c716bfac32dce77d74e5a219a1f9cd01bde0ac3af4b6cbe5
            test: ui/src/e2e/session-progress-motion.e2e.test.ts
            pattern: scrubs embedded Home.*no-preference
            paths: |-
              ui/src/e2e/session-progress-motion.e2e.test.ts
              ui/src/pages/chat/components/chat-composer-controls.ts
          - label: pointer
            patch: diagnostic-pointer.patch
            sha256: 3276d20cee773c1a613cd350351bdca381a237cd283f5cfc9ab15c666c150f5a
            test: ui/src/e2e/chat-composer-pointer-activation.e2e.test.ts
            pattern: Android-like tap
            paths: |-
              ui/src/e2e/chat-composer-pointer-activation.e2e.test.ts
              ui/src/pages/chat/components/chat-composer-dom.ts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f07d1401ab94efa7e4128b13a6219004a7c8b248
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .evidence
          persist-credentials: false
      - name: Apply exact diagnostic patch
        env:
          PATCH_FILE: ${{ matrix.patch }}
          PATCH_SHA: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/diagnostic .artifacts/pointer-diagnostic
          git rev-parse HEAD > .artifacts/diagnostic/source.txt
          echo "$PATCH_SHA  .evidence/$PATCH_FILE" | sha256sum --check
          git apply --check ".evidence/$PATCH_FILE"
          git apply ".evidence/$PATCH_FILE"
          git diff --binary > .artifacts/diagnostic/applied.patch
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
          restore-test-caches: "true"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Run only the requested diagnostic case
        env:
          EVIDENCE_TEST: ${{ matrix.test }}
          EVIDENCE_PATTERN: ${{ matrix.pattern }}
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/diagnostic/failures
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner --maxWorkers 1 "$EVIDENCE_TEST" -t "$EVIDENCE_PATTERN" 2>&1 | tee .artifacts/diagnostic/results.log
      - name: Verify diagnostic source boundary
        if: always()
        env:
          EXPECTED_PATHS: ${{ matrix.paths }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "$EXPECTED_PATHS"
          git diff --cached --exit-code
          cmp .artifacts/diagnostic/applied.patch <(git diff --binary)
          git diff --name-only -z | xargs -0 sha256sum > .artifacts/diagnostic/changed-source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composer-owner-${{ matrix.label }}-${{ github.run_id }}
          path: |
            .artifacts/diagnostic
            .artifacts/home-diagnostic
            .artifacts/pointer-diagnostic
          if-no-files-found: warn
          retention-days: 7
