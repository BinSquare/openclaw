name: Composer final retention and chat gates
on:
  push:
    branches: [solid2/w-chat-5-evidence]
permissions:
  contents: read
concurrency:
  group: composer-final-retention-gates
  cancel-in-progress: false
jobs:
  proof:
    name: Final composer ${{ matrix.group }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [retention-context, chat-gates]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d103e26be23aa984f243f19206d52b35772b2dcd
          persist-credentials: false
      - name: Record exact source
        run: |
          set -euo pipefail
          mkdir -p .artifacts/final-composer-proof
          test "$(git rev-parse HEAD)" = d103e26be23aa984f243f19206d52b35772b2dcd
          git rev-parse HEAD > .artifacts/final-composer-proof/source.txt
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
          restore-test-caches: "true"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Run retention, IME, undo, and changed context tests
        if: matrix.group == 'retention-context'
        run: |
          set -euo pipefail
          pnpm test \
            ui/src/pages/chat/chat-pane-retention.test.ts \
            ui/src/pages/chat/chat-thread-retention.test.ts \
            ui/src/pages/chat/session-snapshot-store.test.ts \
            ui/src/pages/chat/chat-composer-ime.test.ts \
            ui/src/pages/chat/chat-composer-undo-redo.browser.test.ts \
            ui/src/pages/chat/chat-composer-context.test.ts \
            ui/src/pages/chat/chat-composer-context.palette.browser.test.ts \
            --maxWorkers=1 2>&1 | tee .artifacts/final-composer-proof/results.log
      - name: Run four chat E2E gates
        if: matrix.group == 'chat-gates'
        env:
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/final-composer-proof/diagnostics
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner --maxWorkers 1 \
            ui/src/e2e/chat-stream-runtime-budgets.e2e.test.ts \
            ui/src/e2e/chat-composer-input-measurement.e2e.test.ts \
            ui/src/e2e/chat-flow.composer-shortcuts.e2e.test.ts \
            ui/src/e2e/new-session-page.instant-thread.e2e.test.ts 2>&1 | tee .artifacts/final-composer-proof/results.log
      - name: Verify source remained unchanged
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composer-final-${{ matrix.group }}-${{ github.run_id }}
          path: .artifacts/final-composer-proof
          if-no-files-found: warn
          retention-days: 7
