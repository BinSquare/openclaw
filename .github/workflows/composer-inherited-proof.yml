name: Composer current E2E failure attribution
on:
  push:
    branches: [solid2/w-chat-5-evidence]
permissions:
  contents: read
concurrency:
  group: composer-current-e2e-attribution
  cancel-in-progress: false
jobs:
  comparison:
    name: Current E2E attribution (${{ matrix.label }})
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: head
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
          - label: base
            source: d0df645f66013c79290904ac9c4e69f9749b94fd
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Record exact source
        run: |
          mkdir -p .artifacts/attribution
          git rev-parse HEAD > .artifacts/attribution/source.txt
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
          restore-test-caches: "true"
      - uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: restore
      - name: Install WebKit for the Workboard contract
        run: pnpm --dir ui exec playwright install --with-deps webkit
      - name: Compare eight failed E2E files
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "1"
          OPENCLAW_UI_E2E_ARTIFACT_DIR: .artifacts/attribution/screenshots
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/attribution/diagnostics
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner --maxWorkers 1 \
            ui/src/e2e/settings-prefs-reconnect.e2e.test.ts \
            ui/src/e2e/theme-muted-contrast.e2e.test.ts \
            ui/src/pages/workboard/workboard-native-bundle.e2e.test.ts \
            ui/src/e2e/board-mcp-app.e2e.test.ts \
            ui/src/e2e/meetings.e2e.test.ts \
            ui/src/e2e/lazy-custom-element-recovery.e2e.test.ts \
            ui/src/e2e/chat-markdown-table-interactions.e2e.test.ts \
            ui/src/e2e/tool-titles.e2e.test.ts 2>&1 | tee .artifacts/attribution/results.log
      - name: Verify source remained unchanged
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composer-current-attribution-${{ matrix.label }}-${{ github.run_id }}
          path: .artifacts/attribution
          if-no-files-found: warn
          retention-days: 7
