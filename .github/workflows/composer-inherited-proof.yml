name: Composer final CI coverage recovery
on:
  push:
    branches: [solid2/w-chat-5-evidence]
permissions:
  contents: read
concurrency:
  group: composer-final-ci-coverage-recovery
  cancel-in-progress: false
jobs:
  proof:
    name: ${{ matrix.label }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - family: unit
            label: UI unit head 1/3
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 1
          - family: unit
            label: UI unit head 2/3
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 2
          - family: unit
            label: UI unit head 3/3
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 3
          - family: unit
            label: UI unit base 3/3
            source: d0df645f66013c79290904ac9c4e69f9749b94fd
            shard: 3
          - family: e2e
            label: UI E2E head 1/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 1
          - family: e2e
            label: UI E2E head 2/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 2
          - family: e2e
            label: UI E2E head 3/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 3
          - family: e2e
            label: UI E2E head 4/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 4
          - family: e2e
            label: UI E2E head 5/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 5
          - family: e2e
            label: UI E2E head 6/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 6
          - family: e2e
            label: UI E2E head 7/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 7
          - family: e2e
            label: UI E2E head 8/8
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 8
          - family: types
            label: Core types 1/5
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 1
          - family: types
            label: Core types 2/5
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 2
          - family: types
            label: Core types 3/5
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 3
          - family: types
            label: Core types 4/5
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 4
          - family: types
            label: Core types 5/5
            source: 009c3cdd855e2e6675d7721c05f30b5048f8f092
            shard: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .evidence
          persist-credentials: false
      - name: Record exact source and selection
        run: |
          set -euo pipefail
          mkdir -p .artifacts/coverage-proof
          git rev-parse HEAD > .artifacts/coverage-proof/source.txt
          sha256sum .evidence/ui-unit-groups.gzip-base64 .evidence/e2e-include-patterns.json > .artifacts/coverage-proof/selection.sha256
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          semantic-checks: ${{ matrix.family == 'types' && 'true' || 'false' }}
          install-bun: "false"
          cache-mode: restore
          dependency-cache: "true"
          restore-test-caches: "true"
      - name: Setup pinned Bun test runtime
        if: matrix.family == 'unit'
        uses: ./.github/actions/setup-test-bun
      - uses: ./.github/actions/setup-playwright-chromium
        if: matrix.family != 'types'
        with:
          cache-mode: restore
      - name: Install the browser used by the selected native bundle suite
        if: matrix.family == 'e2e'
        run: pnpm --dir ui exec playwright install --with-deps webkit
      - name: Restore the exact UI unit selection
        if: matrix.family == 'unit'
        run: |
          printf 'OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64=%s\n' "$(cat .evidence/ui-unit-groups.gzip-base64)" >> "$GITHUB_ENV"
      - name: Run original Bun-compatible UI unit shard
        if: matrix.family == 'unit'
        env:
          COMPATIBILITY_TARGET: "false"
          OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/coverage-proof/diagnostics
          OPENCLAW_NODE_TEST_CONFIGS_JSON: '["ui/vitest.config.ts"]'
          OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
          OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: ${{ format('["--maxWorkers", "3", "--reporter=verbose", "--reporter=github-actions", "--reporter=./scripts/lib/vitest-resource-reporter.mts", "--shard={0}/3"]', matrix.shard) }}
        run: |
          set -euo pipefail
          DEBUG=vitest:browser:*,pw:browser node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee .artifacts/coverage-proof/results.log
      - name: Run original three-worker UI E2E shard
        if: matrix.family == 'e2e'
        env:
          OPENCLAW_VITEST_INCLUDE_FILE: .evidence/e2e-include-patterns.json
          OPENCLAW_VITEST_MAX_WORKERS: "3"
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: .artifacts/coverage-proof/diagnostics
          EVIDENCE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner --maxWorkers 3 --shard "$EVIDENCE_SHARD/8" 2>&1 | tee .artifacts/coverage-proof/results.log
      - name: Run full core type stripe
        if: matrix.family == 'types'
        env:
          EVIDENCE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          node scripts/run-tsgo-core-test-shards.mjs --stripe "$EVIDENCE_SHARD/5" --concurrency 2 2>&1 | tee .artifacts/coverage-proof/core-types.log
      - name: Run paired root type stripe
        if: ${{ !cancelled() && matrix.family == 'types' && matrix.shard >= 2 }}
        env:
          EVIDENCE_SHARD: ${{ matrix.shard }}
          OPENCLAW_LOCAL_CHECK: "0"
        run: |
          set -euo pipefail
          node scripts/run-tsgo-core-test-shards.mjs --root-stripe "$((EVIDENCE_SHARD - 1))/4" 2>&1 | tee .artifacts/coverage-proof/root-types.log
      - name: Verify source remained unchanged
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composer-coverage-${{ matrix.family }}-${{ matrix.source }}-${{ matrix.shard }}-${{ github.run_id }}
          path: .artifacts/coverage-proof
          if-no-files-found: warn
          retention-days: 7
